services:
  - type: web
    name: golocation-tours-travels
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
    disk:
      name: golocation-data
      mountPath: /var/data
      sizeGB: 1